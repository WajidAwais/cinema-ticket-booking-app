# The ticketing app and its database. Run: docker compose up -d --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  web:
    build: .
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/ticketing
      PORT: 3000
    ports: ["3700:3000"]
    depends_on:
      mongo: { condition: service_healthy }

volumes:
  mongo-data:
