<%- include('partials/top.html') %>
<section class="page-intro">
  <h1>My profile</h1>
  <p class="notice">Accounts aren't built yet; this is a demo user.</p>
</section>
<section class="panel profile" aria-label="Profile details">
  <dl class="summary">
    <div><dt>Name</dt><dd><%= user.name %></dd></div>
    <div><dt>City</dt><dd><%= user.city %></dd></div>
    <div><dt>Email</dt><dd><%= user.email %></dd></div>
    <div><dt>Phone</dt><dd><%= user.phone %></dd></div>
  </dl>
</section>
<%- include('partials/bottom.html') %>
