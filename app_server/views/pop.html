<%- include('partials/top.html') %>
<nav class="steps" aria-label="Booking steps">
  <ol><li aria-current="step">Seats</li><li>Cinema</li><li>Showtime</li><li>Payment</li></ol>
</nav>
<section class="page-intro with-poster">
  <img class="film-poster" src="/img/thumbnails/<%= movie.poster %>" alt="Poster for <%= movie.title %>" width="120" height="174">
  <div>
    <h1><%= movie.title %></h1>
    <p class="film-meta"><%= movie.genre %> · <%= movie.language %></p>
  </div>
</section>
<%- include('partials/errors.html') %>
<form class="panel" method="post" action="/pop.html/<%= encodeURIComponent(movie.title) %>">
  <div class="field">
    <label for="seats">How many seats?</label>
    <input id="seats" name="seats" type="number" min="1" max="<%= MAX_SEATS %>" step="1" required value="<%= form.seats %>" aria-describedby="seats-hint">
    <p id="seats-hint" class="hint">Up to <%= MAX_SEATS %> seats per booking.</p>
  </div>
  <fieldset class="field">
    <legend>Seat class</legend>
    <label class="choice"><input type="radio" name="seatClass" value="gold" <%= form.seatClass !== 'silver' ? 'checked' : '' %>> Gold: reclining seats at the back</label>
    <label class="choice"><input type="radio" name="seatClass" value="silver" <%= form.seatClass === 'silver' ? 'checked' : '' %>> Silver: standard seats</label>
  </fieldset>
  <button class="button" type="submit">Choose a cinema</button>
</form>
<%- include('partials/bottom.html') %>
